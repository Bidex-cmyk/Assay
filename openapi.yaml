openapi: 3.0.3
info:
  title: Assay API
  version: 1.0.0
  description: >-
    Stellar asset trap scanner API contract. This document is the schema
    source for the surface `assay serve` registers; docs/api.md is the human
    reference for the same endpoints, and docs/api-versioning.md states what
    the route version and `schema_version` promise.
paths:
  /api/v1/scan:
    get:
      summary: Scan an asset
      parameters:
        - name: asset
          in: query
          required: true
          schema:
            type: string
          description: Asset code and issuer (e.g. USDC-GA5Z...)
        - name: holder
          in: query
          required: false
          schema:
            type: string
            pattern: '^(G[A-Z2-7]{55}|M[A-Z2-7]{68})$'
          example: GBRPYHIL2CI3FNQ4BXLFMNDLFJUNPU2HY3ZMFSHONUCEOASW7QC7OX2H
          description: >-
            Optional holder account ID: a G... account (56 characters) or an
            M... muxed account (69 characters). A muxed address is resolved to
            its base G... account for the trustline lookup, and the evidence
            records the original address, its multiplexing id, and the account
            that was read. Answers "am I
            exposed?" for that account: the scan reads the holder's trustline
            and adds a "trustline" finding with the trustline's
            is_clawback_enabled and is_authorized flags, adding the
            trustline_clawback_enabled / trustline_deauthorized mechanics when
            set. Severity never changes (it is issuer-level). A holder that does
            not hold the asset, or whose trustline cannot be read, makes the
            report undetermined. An invalid value is a 400 before any fetch; an
            empty value is the same as omitting it. See docs/api.md.
      responses:
        '200':
          description: Successful scan report. May indicate degraded state via header.
          headers:
            X-Assay-Undetermined:
              schema:
                type: string
                enum: ["true"]
              description: Present and set to "true" if the scan was degraded by a source outage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: >-
            Invalid request parameters (including a holder that is neither a
            G... account nor an M... muxed account), or an asset identifier naming the
            network's native asset (native/XLM), which has no issuer and no
            authorization flags and is therefore never scanned or attested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '502':
          description: Upstream scan failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/history:
    get:
      summary: Read an asset's recorded observations and derived transitions
      description: >-
        Reads what GET /api/v1/scan recorded; it never scans. An asset with no
        observations is a successful empty result with state "missing", never
        a 404.
      parameters:
        - name: asset
          in: query
          required: true
          schema:
            type: string
          description: Asset code and issuer (e.g. USDC-GA5Z...)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 256
          description: >-
            Maximum observations to return (default 100, maximum 256). Values
            outside the range are rejected with 400 rather than clamped, so a
            caller's cursor arithmetic stays correct. A page can exceed this
            when observations share its oldest timestamp, because a time
            cursor cannot resume between them.
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >-
            Exclusive time cursor. Returns retained observations strictly older
            than this RFC 3339 timestamp, so a caller pages backwards from
            `next_before`.
      responses:
        '200':
          description: One page of history in time order, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
        '400':
          description: Missing or invalid asset, or the network's native asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/events:
    get:
      summary: Server-sent events stream for capability, severity, and accountability transitions
      description: >-
        Opens a long-lived SSE connection that pushes a message whenever a stored
        observation produces a transition. The stream includes heartbeats every
        15 seconds to keep the connection alive through proxies. Connections are
        capped at 100 concurrent clients per server instance.
      responses:
        '200':
          description: A stream of transition events in SSE format.
          content:
            text/event-stream:
              schema:
                type: string
                description: Each event is a JSON object with asset, transition, and timestamp fields.
        '400':
          description: Missing or invalid asset parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          description: Too many concurrent SSE connections. Retry-After header gives seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SSE not supported by the server infrastructure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/exposure:
    get:
      summary: List trustlines held by an account with per-asset severity and trustline finding
      description: >-
        Bounded and paginated: one request runs up to `limit` full scans
        (default 10, maximum 50). Results are per asset; there is no
        aggregate portfolio score. Each asset carries its own undetermined
        flag and undetermined_checks.
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
          description: >-
            Holder's account address: a G... account, or an M... muxed account
            that resolves to one. A muxed account's trustlines are read from
            its base G... account, and the evidence records the resolution.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
            minimum: 1
          description: Page size; values above the maximum are clamped to it.
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Index of the first trustline to return for the next page.
      responses:
        '200':
          description: One page of per-asset exposure results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exposure'
        '400':
          description: Missing or invalid account, limit, or cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          description: Rate limited. Retry-After header gives seconds to wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The account's trustline list could not be fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /metrics:
    get:
      summary: Scan outcome and per-source failure counters
      description: Counters accumulated since process start.
      responses:
        '200':
          description: A snapshot of the counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
  /healthz:
    get:
      summary: Liveness check
      description: Reports only that the process is up; it checks no upstream.
      responses:
        '200':
          description: The process is running.
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /readyz:
    get:
      summary: Per-upstream readiness check
      description: >-
        The HTTP status tracks the body's status: 200 ready; 503 degraded,
        unavailable, or unknown. No failing probe reports ready.
      responses:
        '200':
          description: Every checkable upstream is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Degraded, unavailable, or unknown; see status and upstreams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /:
    get:
      summary: Serve the single-file UI
      responses:
        '200':
          description: The embedded HTML page.
          content:
            text/html:
              schema:
                type: string
components:
  responses:
    NotFound:
      description: >-
        The requested API path or resource does not exist. Unknown /api/ paths
        carry this shape, so a client decodes a 404 the same way as any other
        API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: >-
        The path exists but does not accept this HTTP method. The Allow header
        names the methods it does accept.
      headers:
        Allow:
          description: The methods the path accepts.
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable description of the problem.
        code:
          type: string
          description: >-
            Stable machine-readable identifier for the error type.
            Consumers should branch on this field, not on the error message.
          enum:
            - not_found
            - method_not_allowed
            - missing_param
            - invalid_asset
            - invalid_holder
            - invalid_param
            - asset_not_found
            - account_not_found
            - upstream_unavailable
            - rate_limited
    Severity:
      type: string
      description: >-
        The severity level name. The order is part of the contract: a level
        never renumbers within a schema version (docs/api-versioning.md).
        "unevaluated" means the issuer flags were never read and is never a
        permissive answer.
      enum: [clear, low, medium, high, critical, unevaluated]
    Accountability:
      type: string
      description: Whether the issuer's advertised home domain publicly claims the asset.
      enum: [unknown, unverified, verified]
    AccountabilityReason:
      type: string
      enum: [fetch_failed, not_claimed, mismatch, no_home_domain]
      description: >-
        Why accountability was not verified: the stellar.toml could not be
        fetched, it was fetched but does not claim the asset, it disagrees with
        the curated directory, or the issuer has no home_domain. Absent when
        the verdict needs no sub-reason (a verified claim).
    Asset:
      type: object
      required: [code, issuer]
      properties:
        code:
          type: string
        issuer:
          type: string
    Evidence:
      type: object
      description: One attributed claim from a named consumed source.
      required: [source, url, claim, retrieved_at, attempted]
      properties:
        source:
          type: string
        url:
          type: string
          description: >-
            The claim's location: the FINAL location after redirects on a
            successful fetch, the requested location on a failed one.
        requested_url:
          type: string
          description: The SEP-1 well-known location derived from home_domain.
        claim:
          type: string
        retrieved_at:
          type: string
          format: date-time
        attempted:
          type: boolean
          description: >-
            True when retrieved_at is the time the fetch was ATTEMPTED rather
            than the time the source answered (the fetch failed).
        refused:
          type: boolean
          description: >-
            True when the failure is a host-policy refusal: the scanner
            declined to make the request at all.
        latest_ledger:
          type: integer
          description: >-
            The latest ledger sequence reported by Horizon when answering.
            Metadata outside the evidence_hash preimage.
        ledger_sequence:
          type: integer
          description: Alias for latest_ledger.
    ClockSkew:
      type: object
      description: >-
        Upstream Date header diagnostic. It does not change observation
        timestamps and is excluded from evidence_hash.
      required: [source, url, server_time, observed_at, skew_seconds, threshold_seconds]
      properties:
        source:
          type: string
        url:
          type: string
        server_time:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        skew_seconds:
          type: integer
          description: Signed difference between local observation time and upstream time.
        threshold_seconds:
          type: integer
          description: Absolute skew limit that was exceeded.
    Finding:
      type: object
      description: One check's verdict over the asset.
      required: [check, title, severity, escalation, undetermined, reasoning, mechanics, evidence]
      properties:
        check:
          type: string
        title:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        escalation:
          type: boolean
          description: True when the severity comes from reputation rather than issuer capability.
        undetermined:
          type: boolean
          description: >-
            True when this check could not reach a conclusion because a source
            it depends on was unreachable — not the same as finding nothing.
        undetermined_by_source:
          type: object
          additionalProperties:
            type: integer
          description: Count of undetermined checks per source name.
        undetermined_rate:
          type: string
          description: '"numerator/denominator" over the checks run for this asset.'
        reasoning:
          type: string
        mechanics:
          type: array
          items:
            type: string
          description: The capability bits this check observed, as names.
        accountability:
          $ref: '#/components/schemas/Accountability'
        accountability_reason:
          $ref: '#/components/schemas/AccountabilityReason'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
    Report:
      type: object
      description: >-
        The scan report, also printed by `assay scan`. `schema_version` is the
        payload contract version, independent of the /api/v1 route version.
      required:
        - schema_version
        - asset
        - severity
        - base_severity
        - escalated
        - accountability
        - state
        - stale
        - undetermined
        - undetermined_checks
        - mechanics
        - findings
        - evidence
        - scanned_at
      properties:
        schema_version:
          type: integer
          description: Version of the report JSON shape; additive changes do not bump it.
        asset:
          $ref: '#/components/schemas/Asset'
        severity:
          $ref: '#/components/schemas/Severity'
        base_severity:
          $ref: '#/components/schemas/Severity'
        escalated:
          type: boolean
          description: True when reputation raised the level above base_severity.
        accountability:
          $ref: '#/components/schemas/Accountability'
        accountability_reason:
          $ref: '#/components/schemas/AccountabilityReason'
        state:
          type: string
          enum: [valid, unknown, stale]
        stale:
          type: boolean
        stale_reason:
          type: string
        undetermined:
          type: boolean
        undetermined_checks:
          type: array
          items:
            type: string
        undetermined_by_source:
          type: object
          additionalProperties:
            type: integer
        undetermined_rate:
          type: string
        network:
          type: string
          description: The Stellar network passphrase the facts were read from.
        checks:
          type: array
          items:
            type: string
          description: The sorted IDs of the checks the engine actually ran.
        partial_check_set:
          type: boolean
          description: True when the engine ran with a partial check set under AllowPartialCheckSet.
        allow_partial_check_set:
          type: boolean
          description: True when the engine was explicitly permitted to run with a partial check set.
        scanner_bound:
          type: boolean
          description: True when the report binds attest.ScannerIdentity into its preimage.
        mechanics:
          type: array
          items:
            type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        clock_skews:
          type: array
          description: Present only when an upstream Date header exceeds the local clock-skew threshold.
          items:
            $ref: '#/components/schemas/ClockSkew'
        observation_window_start:
          type: string
          format: date-time
        observation_window_end:
          type: string
          format: date-time
        scanned_at:
          type: string
          format: date-time
    Observation:
      type: object
      description: >-
        One recorded scan, as retained by the history store: the report's
        verdict fields plus the full mechanic bitset.
      required: [asset, at, mechanics, base_severity, severity, accountability, undetermined]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        at:
          type: string
          format: date-time
        mechanics:
          type: integer
          description: The full mechanic bitset the report carried, as a number.
        base_severity:
          $ref: '#/components/schemas/Severity'
        severity:
          $ref: '#/components/schemas/Severity'
        accountability:
          $ref: '#/components/schemas/Accountability'
        undetermined:
          type: boolean
        undetermined_checks:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
    Transition:
      type: object
      description: >-
        The derived difference between two consecutive observations. A state
        other than "valid" means no comparison could be made; it never means
        "no change".
      required:
        - asset
        - from
        - to
        - state
        - added
        - removed
        - added_names
        - removed_names
        - base_before
        - base_after
        - severity_before
        - severity_after
        - attribution
        - accountability
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        from:
          $ref: '#/components/schemas/Observation'
        to:
          $ref: '#/components/schemas/Observation'
        state:
          type: string
          enum: [valid, unknown, missing]
        reason:
          type: string
        added:
          type: integer
          description: Capability bits present in the later observation only.
        removed:
          type: integer
          description: Capability bits present in the earlier observation only.
        added_names:
          type: array
          items:
            type: string
        removed_names:
          type: array
          items:
            type: string
        base_before:
          $ref: '#/components/schemas/Severity'
        base_after:
          $ref: '#/components/schemas/Severity'
        severity_before:
          $ref: '#/components/schemas/Severity'
        severity_after:
          $ref: '#/components/schemas/Severity'
        attribution:
          type: string
          enum: [none, capability, reputation, both]
        deescalation:
          $ref: '#/components/schemas/Deescalation'
        accountability:
          $ref: '#/components/schemas/AccountabilityMovement'
    Deescalation:
      type: object
      description: >-
        A typed severity decrease, present exactly when the final severity fell
        between two valid observations. It names the evidence source(s) whose
        withdrawn claim produced the fall, so a reversal is observable without
        diffing evidence by hand.
      required: [from, to, attribution, sources]
      properties:
        from:
          $ref: '#/components/schemas/Severity'
        to:
          $ref: '#/components/schemas/Severity'
        attribution:
          type: string
          enum: [none, capability, reputation, both]
          description: The axis that produced the fall.
        sources:
          type: array
          description: >-
            Evidence sources that withdrew an escalation-causing claim, sorted
            and deduplicated. Empty when severity fell without a source's
            evidence recording the withdrawal.
          items:
            type: string
        reason:
          type: string
    AccountabilityMovement:
      type: object
      description: >-
        The change in who publicly claims the asset, independent of severity.
        A state other than "valid" means no comparison could be made; from, to
        and changed then carry no verdict.
      required: [from, to, changed, state]
      properties:
        from:
          type: string
          enum: [unknown, unverified, verified, ""]
        to:
          type: string
          enum: [unknown, unverified, verified, ""]
        changed:
          type: boolean
        state:
          type: string
          enum: [valid, unknown, missing]
        reason:
          type: string
    History:
      type: object
      description: The body of GET /api/v1/history.
      required: [asset, state, count, observations, transitions, limit, retention, max_assets]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        state:
          type: string
          description: >-
            The completeness of the history, not of any request. "missing" is
            an explicit empty result, never a 404.
          enum: [valid, unknown, missing]
        reason:
          type: string
          description: Present when state is not valid.
        count:
          type: integer
          description: Observations returned on this page, not in the whole history.
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        transitions:
          type: array
          description: >-
            Differences between consecutive observations, including the one
            from the predecessor before this page, so a change at a page
            boundary is still reported.
          items:
            $ref: '#/components/schemas/Transition'
        limit:
          type: integer
          description: Page size actually applied.
        next_before:
          type: string
          format: date-time
          description: >-
            Cursor for the next (older) page; send it back as `before`. Absent
            on the page that reaches the oldest retained observation.
        latest_at:
          type: string
          format: date-time
          description: The most recent observation overall, not only on this page.
        latest_age_secs:
          type: integer
        retention:
          type: integer
          description: The per-asset observation cap these results were read against.
        max_assets:
          type: integer
          description: >-
            The global cap on assets the store retains. Eviction is whole-asset
            and least-recently-observed-first, so on a deployment at the cap a
            `missing` state means "not retained", not "never observed".
    Exposure:
      type: object
      description: The body of GET /api/v1/exposure.
      required: [account, total, limit, count, assets]
      properties:
        account:
          type: string
        total:
          type: integer
          description: Credit trustlines on the account (whole listing, not this page).
        limit:
          type: integer
          description: Page size actually applied.
        count:
          type: integer
        next_cursor:
          type: integer
          description: Cursor for the next page; absent on the last page.
        assets:
          type: array
          items:
            $ref: '#/components/schemas/ExposureAsset'
    ExposureAsset:
      type: object
      description: One asset on an exposure page, with its own severity and completeness.
      required: [asset, severity, undetermined, undetermined_checks]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        severity:
          $ref: '#/components/schemas/Severity'
        undetermined:
          type: boolean
        undetermined_checks:
          type: array
          items:
            type: string
        finding:
          $ref: '#/components/schemas/Finding'
        reason:
          type: string
          description: Why this asset's scan failed; present only when finding is absent.
    Readiness:
      type: object
      required: [status, checked_at, age_secs, upstreams]
      properties:
        status:
          type: string
          enum: [ready, degraded, unavailable, unknown]
        reason:
          type: string
          description: Present when status is not ready.
        checked_at:
          type: string
          format: date-time
        age_secs:
          type: integer
        upstreams:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamStatus'
        registry_staleness:
          type: object
          description: Informational registry freshness; does not affect readiness status.
          required: [status, checked_at, window_secs, asset_count, attested_count, unattested_count, stale_count]
          properties:
            status:
              type: string
              enum: [current, stale, incomplete, unknown]
            reason:
              type: string
            checked_at:
              type: string
              format: date-time
            window_secs:
              type: integer
            asset_count:
              type: integer
            attested_count:
              type: integer
            unattested_count:
              type: integer
            stale_count:
              type: integer
            oldest_attestation:
              type: object
              required: [asset, attested_at, age_secs]
              properties:
                asset:
                  type: string
                attested_at:
                  type: string
                  format: date-time
                age_secs:
                  type: integer
    UpstreamStatus:
      type: object
      required: [name, kind, reachable, probe_url]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [horizon, consumed]
        reachable:
          type: boolean
        probe_error:
          type: string
        probe_url:
          type: string
    Metrics:
      type: object
      description: >-
        Monotonically increasing counters since process start; a consumer
        derives rates from consecutive reads.
      required: [scan_outcomes, source_failures]
      properties:
        scan_outcomes:
          type: object
          additionalProperties:
            type: integer
          description: Count of scans per outcome class (complete, undetermined, not_found, upstream_failure).
        source_failures:
          type: object
          additionalProperties:
            type: integer
          description: Count of scans per upstream source that failed to answer.
